he.","hs.fleche":"Flèche de craie","say.sceau_trouve":"Dans la niche, un hexagone de bronze gravé d’une porte : le Sceau du Seuil.","hs.niche":"Niche du Sceau","say.note_catalogue":"Un livre, c’est des pages, des lignes, des lettres. Un catalogue en est la somme.","hs.note_catalogue":"Plaque du fichier","hs.vers_g3c":"Porte du Puits","hs.retour_v1":"Porte du Sceau","scene.eveil.1":"Froid. Le sol est de pierre, et il y a du papier dans l’air.","scene.eveil.2":"Des dos de livres, partout, jusqu’à ce que la vue se perde.","scene.eveil.3":"Je ne me souviens pas de mon nom. Il y a de la lumière, au centre.","scene.lampe.1":"La flamme saute de ma torche au brasero.","scene.lampe.2":"Au fond, une porte que l’ombre cachait.","voice.bienvenue":"Sois le bienvenu. Tu n’es pas le premier à arriver.","scene.sceau.1":"Le Sceau s’enchâsse. Un creux s’éclaire ; quatre restent noirs.","scene.sceau.2":"Dans le miroir, toujours aucun reflet. Mais quelque chose m’a vu.","voice.sceau":"Un Sceau sur cinq. Les autres dorment plus loin, là où lire devient dangereux.","room.G1":"Palier d’arrivée","room.G2":"Galerie 12","room.G3":"Le Puits","room.G4":"Galerie basse","room.G5":"Chambre du Catalogue"},Kv={"hint.S-P1.1":"Ces pages ne sont pas vides.","hint.S-P1.2":"La chaleur révèle l'encre pâle.","hint.S-P1.3":"Approche la torche, puis lis dans l'ordre des pupitres.","hint.S-P2.1":"Presque tout est du bruit.","hint.S-P2.2":"Cherche une page qui a du sens.","hint.S-P2.3":"La phrase est à la ligne 3 : décalage 3.","hint.S-P3.1":"Ces lettres sont déplacées.","hint.S-P3.2":"Le chiffre du livre est un nombre.","hint.S-P3.3":"Recule chaque lettre de trois rangs.","hint.S-P4.1":"L'encre monte.","hint.S-P4.2":"Les Copistes craignent ta flamme.","hint.S-P4.3":"Trois vannes, trois bouchons.","hint.S-P5.1":"Un livre se fabrique par étapes.","hint.S-P5.2":"Un schéma est dessiné au mur.","hint.S-P5.3":"Cahier, fil, cuir, fermoir.","hint.S-P6.1":"Le Copiste attend quelque chose.","hint.S-P6.2":"Il lit ce qu
