<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<meta name="description" content=""">
<meta name="theme-color" content="#063a20">
<script src="site.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="assets/world.js"></script>
<style>
:root{
  --green:#8DA25F; --green-d:#5f7340; --green-l:#e9eedb; --sage:#c9d7a5;
  --ink:#1c1d1a; --ink-2:#5a5b55; --ivory:#f6f3ea; --paper:#fffdf8; --line:#e4e0d3;
  --ease:cubic-bezier(.22,.8,.24,1);
  --shadow:0 1px 0 rgba(28,29,26,.04),0 18px 40px -18px rgba(28,29,26,.22);
  --spread:104px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);background:var(--ivory);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.has-cart-items{padding-bottom:7.5rem}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit}
section{scroll-margin-top:84px}
.wrap{max-width:1160px;margin:auto;padding:0 22px}
.script{font-family:Lora,Georgia,serif;font-style:italic;font-weight:500;color:var(--green-d);font-size:1.2rem;line-height:1.2}
h1,h2,h3{line-height:1.05;letter-spacing:-.025em}
h2{font-size:clamp(2rem,4.4vw,3.1rem);font-weight:800}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* boutons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;font:600 .98rem 'Open Sans';padding:15px 28px;border-radius:99px;background:var(--ink);color:#fff;text-decoration:none;transition:background .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease);overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease);z-index:-1}
.btn:hover{background:var(--green-d);box-shadow:0 12px 26px -10px rgba(95,115,64,.7)}
.btn:hover::after{transform:translateX(120%)}
.btn.green{background:var(--green-d)}
.btn.green:hover{background:var(--ink)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost:hover{background:#fff;color:var(--ink)}
.btn.sm{padding:10px 20px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.wide{width:100%}

/* bandeaux + en-tête */
/* à domicile : le trajet de Luigi */
.visit{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:start}
.visit>*{min-width:0}
.vform{background:var(--paper);border-radius:30px;padding:34px;box-shadow:var(--shadow)}
.vstep{padding:22px 0;border-bottom:1px solid var(--line)}
.vstep:first-child{padding-top:0}.vstep:last-child{border:0;padding-bottom:0}
.vstep h4{display:flex;align-items:center;gap:12px;font-size:1.02rem;margin-bottom:14px}
.vstep h4 i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ivory);box-shadow:inset 0 0 0 1.5px var(--line);font:700 .78rem 'Open Sans';font-style:normal;transition:.4s var(--ease)}
.vstep.done h4 i{background:var(--green-d);color:#fff;box-shadow:none}
.vstep h4 small{margin-left:auto;font-weight:500;color:var(--ink-2);font-size:.8rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink);transition:border-color .3s,background .3s,transform .4s var(--ease),box-shadow .3s}
.opt:hover{transform:translateY(-3px);border-color:var(--green)}
.opt.on{border-color:var(--green-d);background:#f7f9ef;box-shadow:0 14px 28px -18px rgba(95,115,64,.7)}
.opt .ic{font-size:1.5rem;color:var(--green-d);margin-bottom:6px}
.opt b{font-size:.98rem;line-height:1.2}
.opt span{font-size:.8rem;color:var(--ink-2)}
.opt em{font-style:normal;font-weight:800;font-size:1.05rem;margin-top:6px}
.opt em s{font-weight:500;color:#999;font-size:.78rem;margin-left:6px}
.opt .badge{top:-10px;right:10px}
.guests{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.guests .step button{width:38px;height:38px}
.guests .step b{font-size:1.2rem;min-width:36px}
.gnote{font-size:.85rem;color:var(--ink-2)}
.gnote b{color:var(--green-d)}
.dates{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:thin;scroll-snap-type:x proximity}
.dt{flex:none;scroll-snap-align:start;min-width:66px;padding:10px 8px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;text-align:center;color:var(--ink);transition:.3s var(--ease)}
.dt small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.dt b{display:block;font-size:1.35rem;line-height:1.1}
.dt span{font-size:.72rem;color:var(--ink-2)}
.dt:hover{border-color:var(--green);transform:translateY(-2px)}
.dt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dt.on small,.dt.on span{color:rgba(255,255,255,.7)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.c2{padding:10px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font:600 .88rem 'Open Sans';color:var(--ink);transition:.3s var(--ease)}
.c2:hover{border-color:var(--green)}
.c2.on{background:var(--green-d);border-color:var(--green-d);color:#fff}
.toggle{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--ivory);cursor:pointer;width:100%;border:0;text-align:left;color:var(--ink);font:inherit}
.toggle .sw{flex:none;width:44px;height:26px;border-radius:99px;background:#cfd1c3;position:relative;transition:background .3s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.toggle.on .sw{background:var(--green-d)}
.toggle.on .sw::after{transform:translateX(18px)}
.toggle b{display:block;font-size:.95rem}
.toggle small{color:var(--ink-2)}
.vside{position:sticky;top:92px;max-height:calc(100vh - 108px);overflow-y:auto;scrollbar-width:none;display:grid;gap:14px;align-content:start}
.vside::-webkit-scrollbar{display:none}
.route{position:relative;border-radius:30px;background:var(--ink);color:#fff;padding:18px 20px 8px;overflow:hidden}
.route h4{font-size:1.05rem;font-weight:700}
.route p{font-size:.84rem;opacity:.7;min-height:2.4em;margin-top:2px}
.route svg.map{display:block;width:100%;max-width:370px;height:auto;margin:4px auto 0;overflow:visible}
.route .trk{fill:none;stroke:rgba(255,255,255,.2);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.route .pg{fill:none;stroke:var(--sage);stroke-width:3.5;stroke-linecap:round}
.route .lbl{font:600 11px 'Open Sans';fill:rgba(255,255,255,.75)}
.route .pin{fill:var(--sage)}
.route .vespa{color:#fff;stroke:currentColor}
.route .vbg{fill:var(--green-d);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.ticket{position:relative;background:var(--paper);border-radius:26px;padding:20px 22px 18px;box-shadow:var(--shadow)}
.ticket::before,.ticket::after{content:"";position:absolute;top:98px;width:22px;height:22px;border-radius:50%;background:var(--ivory);box-shadow:inset 0 0 0 1px var(--line)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.tk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;margin-bottom:10px;border-bottom:2px dashed var(--line)}
.tk-h .kicker{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green-d);font-weight:700}
.tk-h h4{font-size:1.25rem;font-weight:800;margin-top:2px;line-height:1.15}
.stamp{flex:none;display:grid;place-items:center;width:70px;height:70px;border-radius:50%;border:2px solid var(--green-d);color:var(--green-d);font:700 .5rem 'Open Sans';letter-spacing:.1em;text-transform:uppercase;text-align:center;line-height:1.25;transform:rotate(-12deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--green-d)}
.tk-r{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:.88rem;color:var(--ink-2)}
.tk-r b{color:var(--ink);text-align:right}
.tk-r.d b{color:var(--green-d)}
.tk-t{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px;padding-top:10px;border-top:2px dashed var(--line);font-weight:800}
.tk-t span:last-child{font-size:2rem;letter-spacing:-.03em}
.tk-t s{font-weight:500;color:#999;font-size:.9rem;margin-right:8px}
.ticket .btn{margin-top:10px}
.ticket small.nb{display:block;text-align:center;margin-top:10px;color:var(--ink-2);font-size:.76rem}
/* arrivée du scooter */
.route .pinG{transform-box:fill-box;transform-origin:50% 100%}
.route .bob{transform-box:fill-box;transform-origin:center}
.route .ripple{fill:none;stroke:var(--sage);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.route.arrived .pinG{animation:pinpop .9s var(--ease)}
.route.arrived .ripple{animation:ripple 1.1s ease-out 2}
.route.arrived .bob{animation:hop .55s ease-out 2}
@keyframes pinpop{0%{transform:scale(1)}35%{transform:scale(1.45) translateY(-5px)}65%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.8)}}
@keyframes hop{40%{transform:translateY(-9px) rotate(-6deg)}}
@media(max-height:820px){.route svg.map{max-width:300px}.route p{min-height:0}}
@media(max-width:960px){.visit{grid-template-columns:minmax(0,1fr)}.vside{position:static;max-height:none;overflow:visible}}
@media(max-width:560px){.vform{padding:22px 18px;border-radius:24px}.opts{grid-template-columns:1fr}.opt{flex-direction:row;align-items:center;gap:14px;padding:14px}.opt .ic{margin:0}.opt .txt{flex:1}.opt em{margin:0}.opt .badge{top:-9px}}

header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--ivory) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,background .3s}
header.scrolled{border-color:var(--line);background:rgba(246,243,234,.94)}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px}
.nav .logo img{height:58px;width:auto}
.stage .item,.it .th img{border-radius:18px}
.nav ul{display:flex;gap:34px;list-style:none;padding:0;font-weight:500;font-size:.95rem}
.nav ul a{text-decoration:none;position:relative;padding:6px 0}
.nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--green-d);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav ul a:hover::after{transform:scaleX(1)}
.nav .right{display:flex;align-items:center;gap:10px}
.cartbtn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--ink);color:#fff;border-radius:99px;padding:11px 18px;font:600 .92rem 'Open Sans';transition:background .3s}
.cartbtn:hover{background:var(--green-d)}
.cartbtn .n{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--green);color:var(--ink);font-size:.78rem}
.cartbtn .n.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.35)}}
.menubtn{display:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;place-items:center;font-size:1.2rem;color:var(--ink)}
.mnav{display:none}
@media(max-width:860px){
  .nav ul{display:none}
  .menubtn{display:grid}
  .nav .logo img{height:50px}
  .mnav{display:block;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);padding:6px 22px 16px;max-height:0;overflow:hidden;visibility:hidden;transition:max-height .4s var(--ease),visibility 0s .4s}
  .menu-open .mnav{max-height:340px;visibility:visible;transition:max-height .4s var(--ease)}
  .mnav a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500;font-size:1.05rem}
  .mnav a:last-child{border:0}
}

/* hero */
.hero{--px:0;--py:0;--sy:0;position:relative;color:#fff;min-height:min(86svh,820px);display:grid;align-items:end;overflow:hidden;isolation:isolate;background:#1c2417}
.hero-bg{position:absolute;inset:-4%;max-width:none;z-index:-2;background:center/cover;transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-10px + var(--sy)*1px),0) scale(1.06);transition:transform .35s ease-out;will-change:transform}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(14,20,10,.82) 0%,rgba(14,20,10,.5) 34%,rgba(14,20,10,.06) 62%,rgba(14,20,10,0) 100%),linear-gradient(0deg,rgba(14,20,10,.7),transparent 45%)}
.hero .wrap{padding-top:110px;padding-bottom:64px;width:100%}
.hero .script{color:var(--sage);font-size:1.9rem}
.hero h1{font-size:clamp(2.9rem,8vw,6rem);font-weight:800;max-width:11.5ch;margin:8px 0 22px}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:rise 1s var(--ease) forwards}
.hero h1 span:nth-child(2) i{animation-delay:.12s}.hero h1 span:nth-child(3) i{animation-delay:.24s}
@keyframes rise{to{transform:none}}
.hero p.lead{max-width:44ch;font-size:1.15rem;color:rgba(255,255,255,.86);margin-bottom:30px;opacity:0;animation:fade 1s .5s var(--ease) forwards}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;opacity:0;animation:fade 1s .65s var(--ease) forwards}
.hero .btn:not(.ghost){background:#fff;color:var(--ink)}
.hero .btn:not(.ghost):hover{background:var(--sage)}
@keyframes fade{to{opacity:1}}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:44px;padding-top:22px;border-top:1px solid rgba(255,255,255,.2);font-size:.9rem;color:rgba(255,255,255,.82);opacity:0;animation:fade 1s .8s var(--ease) forwards}
.facts span{display:inline-flex;align-items:center;gap:9px}
.facts .ic{color:var(--sage);font-size:1.2em}
.hero .spot{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px circle at var(--mx,70%) var(--my,40%),rgba(201,215,165,.18),transparent 60%)}
@media(max-width:640px){.hero .wrap{padding-top:70px;padding-bottom:40px}.facts{gap:12px 22px;margin-top:30px}.hero .cta .btn{flex:1 1 100%}}

/* révélations */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

section.s{padding:104px 0}
.head{text-align:center;margin-bottom:56px}
.head p{color:var(--ink-2);max-width:54ch;margin:14px auto 0}
.head .script{display:block;margin-bottom:6px}
@media(max-width:640px){section.s{padding:68px 0}.head{margin-bottom:36px}}

/* DÉCOMPOSITION : --open pilote tout ; le suivi souris est sur une couche séparée (.par) sans effet de rebond */
.dec{--open:0}
@media(hover:hover){.dec:hover{--open:1}}
.dec.is-open,.dec:focus-within{--open:1}
.stage{--px:0;--py:0;--spread:30cqw;container-type:inline-size;position:relative;height:310px;display:block;cursor:pointer;touch-action:manipulation}
.stage .ring{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;max-height:100%;border-radius:50%;border:1.5px dashed rgba(95,115,64,.55);opacity:calc(var(--open)*.9);transform:translate(-50%,-50%) scale(calc(.62 + .38*var(--open))) rotate(calc(var(--open)*90deg*var(--rm,1)));transition:transform .9s var(--ease),opacity .6s var(--ease);will-change:transform}
.stage .ring.r2{width:56%;border-style:solid;border-color:rgba(141,162,95,.28);transform:translate(-50%,-50%) scale(calc(.5 + .5*var(--open))) rotate(calc(var(--open)*-60deg*var(--rm,1)))}
.stage .glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(201,215,165,.65),transparent);opacity:calc(.35 + var(--open)*.4);transition:opacity .6s}
.stage .par{position:absolute;inset:6% 0 9% 0;display:flex;align-items:center;justify-content:center;transform:translate3d(calc(var(--px)*12px),calc(var(--py)*9px),0);transition:transform .18s ease-out;will-change:transform}
.stage .item{height:100%;width:auto;max-width:92%;object-fit:contain;transform:scale(calc(1 - .24*var(--open))) rotate(calc(var(--open)*-6deg*var(--rm,1)));transition:transform .9s var(--ease);will-change:transform}
.stage .par::after{content:"";position:absolute;left:50%;bottom:-3%;width:46%;height:12px;margin-left:-23%;border-radius:50%;background:radial-gradient(closest-side,rgba(28,29,26,.3),transparent);transform:scaleX(calc(1 - .22*var(--open)));transition:transform .9s var(--ease);z-index:-1}
.stage .chip{position:absolute;left:50%;top:50%;z-index:2;padding:7px 14px;border-radius:99px;background:var(--paper);box-shadow:0 8px 22px -8px rgba(28,29,26,.35),0 0 0 1px var(--line);font-size:.74rem;font-weight:600;white-space:nowrap;opacity:var(--open);transform:translate(-50%,-50%) translate(calc(var(--tx)*var(--spread)*var(--open)),calc(var(--ty)*var(--spread)*var(--open)*.92)) scale(calc(.6 + .4*var(--open)));transition:transform .85s var(--ease),opacity .45s var(--ease);transition-delay:calc(var(--i)*55ms);will-change:transform,opacity;pointer-events:none}
.stage .chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:1px}
.hint{display:none;text-align:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hint .ic{vertical-align:-2px;margin-right:6px}
@media(hover:none){.hint{display:block}}
@media(max-width:640px){.stage{height:290px}.stage .chip{font-size:.7rem;padding:6px 11px}}

/* offre café */
.offer{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center;background:var(--paper);border-radius:32px;padding:44px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.offer .vis{background:radial-gradient(circle at 50% 40%,var(--green-l),transparent 72%),var(--ivory);border-radius:24px;padding:12px 8px 14px}
.offer .stage{height:400px}
.offer .stage .par{inset:3% 0 8% 0}
.tag{display:inline-block;color:var(--green-d);font-weight:600;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
.offer h3{font-size:2.3rem;margin:10px 0 10px;font-weight:800}
.offer .desc{color:var(--ink-2);margin-bottom:22px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;padding:4px;border-radius:14px;background:var(--ivory);margin:6px 0 20px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;padding:11px 8px;border-radius:11px;font:600 .9rem 'Open Sans';cursor:pointer;color:var(--ink-2);transition:color .3s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px - (var(--n,3) - 1)*4px)/var(--n,3));border-radius:11px;background:var(--ink);transition:transform .45s var(--ease)}
.tiers{display:grid;gap:12px;margin:0 0 22px}
.tier{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:16px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;background:var(--paper);transition:border-color .3s,background .3s,transform .3s var(--ease),box-shadow .3s}
.tier:hover{border-color:var(--green);transform:translateX(3px)}
.tier.on{border-color:var(--green-d);background:#f7f9ef;box-shadow:0 12px 26px -16px rgba(95,115,64,.55)}
.tier i{width:20px;height:20px;border:1.5px solid #b9b9ad;border-radius:50%;display:block;transition:.3s}
.tier.on i{border-color:var(--green-d);background:radial-gradient(var(--green-d) 46%,transparent 52%)}
.tier strong{display:block;font-size:1.02rem}
.tier small{color:var(--ink-2)}
.tier .p{text-align:right;font-weight:800;font-size:1.2rem}
.tier .p s{display:block;font-weight:500;color:#999;font-size:.8rem}
.badge{position:absolute;top:-10px;right:16px;background:var(--ink);color:#fff;font-size:.62rem;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.14em;text-transform:uppercase}
.save{color:var(--green-d);font-weight:700}
@media(max-width:900px){.offer{grid-template-columns:1fr;gap:26px;padding:22px 18px;border-radius:26px}.offer .stage{height:330px}.offer h3{font-size:1.9rem}}

/* grille produits */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px}
.card{--mx:50%;--my:30%;position:relative;display:flex;flex-direction:column;background:var(--paper);border-radius:26px;padding:20px 22px 24px;box-shadow:var(--shadow);overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s var(--ease),opacity .9s var(--ease)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(201,215,165,.34),transparent 60%);opacity:0;transition:opacity .4s}
@media(hover:hover){.card.in:hover{transform:translateY(-6px);box-shadow:0 1px 0 rgba(28,29,26,.04),0 30px 54px -22px rgba(28,29,26,.3)}.card:hover::before{opacity:1}}

.card .meta{position:relative;margin-top:6px}

.card .fmt{color:var(--ink-2);font-size:.9rem}
.card p{color:var(--ink-2);font-size:.94rem;margin:10px 0 0;flex:1}
.card .row{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;min-height:46px}
.price{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.soldout{position:absolute;top:18px;left:18px;z-index:3;background:var(--ink);color:#fff;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:99px}

/* stepper */
.step{display:inline-flex;align-items:center;gap:2px;background:var(--ivory);border:1px solid var(--line);border-radius:99px;padding:3px}
.step button{width:32px;height:32px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .25s,color .25s,transform .25s var(--ease)}
.step button:hover{background:var(--green-d);color:#fff}
.step button:active{transform:scale(.88)}
.step button.del{color:#a8402c}
.step button.del:hover{background:#a8402c;color:#fff}
.step button:disabled{opacity:.3;pointer-events:none}
.step b{min-width:26px;text-align:center;font-size:.95rem;font-variant-numeric:tabular-nums}

/* barre de progression a jalons */
.meter{--m-track:#dcdfce;--m-fill-a:var(--green);--m-fill-b:var(--green-d);--m-dot:var(--paper);--m-dot-line:#c9ccbb;--m-ic:#8b8d80;--m-lab:var(--ink-2);--m-lab-s:#9a9c8f;position:relative;margin:16px 16px 44px}
.m-track{position:relative;height:4px;border-radius:99px;background:var(--m-track)}
.m-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--m-fill-a),var(--m-fill-b));transition:width .9s var(--ease)}
.m-fill::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--m-fill-b);box-shadow:0 0 0 4px rgba(141,162,95,.28);opacity:0;transition:opacity .4s}
.m-fill.live::after{opacity:1}
.m-node{position:absolute;top:2px;transform:translate(-50%,-50%)}
.m-dot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--m-dot);box-shadow:inset 0 0 0 1.5px var(--m-dot-line);color:var(--m-ic);font-size:15px;transition:background .5s var(--ease),box-shadow .5s,color .5s,transform .5s var(--ease)}
.m-node.ok .m-dot{background:var(--green-d);box-shadow:0 0 0 5px rgba(141,162,95,.25);color:#fff;transform:scale(1.08)}
.m-lab{position:absolute;top:36px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:.72rem;font-weight:600;color:var(--m-lab);line-height:1.2}
.m-lab small{display:block;font-weight:500;color:var(--m-lab-s);font-size:.68rem}
.m-node.end .m-lab{left:auto;right:-14px;transform:none;text-align:right}
.m-node.ok .m-lab{color:var(--green-d)}

/* box */
.builder{--mx:80%;--my:10%;position:relative;background:var(--ink);color:#fff;border-radius:34px;padding:68px 44px;overflow:hidden;isolation:isolate}
.builder::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(141,162,95,.22),transparent 65%)}
.builder h2{color:#fff}
.builder .script{color:var(--sage)}
.bhead{text-align:center;max-width:620px;margin:0 auto 42px}
.bhead p{opacity:.78;margin-top:12px}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:stretch;max-width:1020px;margin:auto}
.bi{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--green) transparent;-webkit-overflow-scrolling:touch}
.bi::-webkit-scrollbar{height:6px}.bi::-webkit-scrollbar-thumb{background:var(--green);border-radius:6px}
.bnav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bnav small{opacity:.6;margin-right:auto}
.bnav button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.bnav button:hover{background:var(--green)}
.bpre{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px;margin:-14px auto 30px}
.bpre button{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-weight:600;font-size:.9rem;min-height:40px;transition:background .25s}
.bpre button small{display:block;font-weight:400;opacity:.65;font-size:.72rem}
.bpre button:hover{background:rgba(255,255,255,.16)}
.bpre button.on{background:var(--green);box-shadow:none;color:var(--ink)}
.bpre-d{text-align:center;opacity:.75;margin:-14px 0 24px;font-size:.92rem}
.it{flex:0 0 172px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:10px;border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:background .3s,transform .4s var(--ease)}
.it:hover{background:rgba(255,255,255,.1);transform:translateY(-3px)}
.it .th{width:100%;aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.it .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.it:hover .th img{transform:scale(1.1) rotate(-5deg)}
.it>div:nth-child(2){flex:1;display:flex;flex-direction:column;gap:3px}
.it b.nm{display:block;font-size:.98rem;line-height:1.25;min-height:2.5em}
.it small.fm{display:block;line-height:1.3;min-height:2.6em}
.it .pr{font-size:1rem;color:var(--sage);margin-top:auto}
.it .step{align-self:center;margin-top:2px}
.it small{opacity:.6}
.builder .step{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.builder .step button{background:rgba(255,255,255,.1);color:#fff}
.builder .step button:hover{background:var(--green)}
.builder .step button.del{color:#f0a393}
.builder .step button.del:hover{background:#b8472f;color:#fff}
.sum{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:34px 30px;border-radius:24px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sum .meter{--m-track:rgba(255,255,255,.16);--m-dot:#2b2c28;--m-dot-line:rgba(255,255,255,.28);--m-ic:rgba(255,255,255,.55);--m-lab:rgba(255,255,255,.7);--m-lab-s:rgba(255,255,255,.4);--m-fill-a:var(--green);--m-fill-b:var(--sage);margin:26px 18px 48px;text-align:left}

.sum s{opacity:.5}
.sum .mini{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 10px;font-size:.9rem;color:rgba(255,255,255,.7);margin-top:2px}

.sum .mini em{font-style:normal;color:var(--sage);font-weight:600}
.boxviz{position:relative;min-height:118px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;margin:4px 0 16px;padding:14px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.boxviz .empty-v{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:rgba(255,255,255,.4);letter-spacing:.04em;pointer-events:none;transition:opacity .3s}
.boxviz.has .empty-v{opacity:0}
.fl{position:relative;width:56px;height:72px;animation:flIn .6s cubic-bezier(.3,1.5,.5,1) both}
.fl.out{animation:flOut .3s ease-in forwards}
.fli{position:absolute;inset:0;border-radius:15px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 10px 18px -10px rgba(0,0,0,.6);animation:bob var(--d,3.6s) ease-in-out var(--dl,0s) infinite}
.fli img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:cover;border-radius:11px}
.fl.slot .fli{background:rgba(255,255,255,.03);box-shadow:none;border:1.5px dashed rgba(255,255,255,.28)}
.fl.slot .fli::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:rgba(255,255,255,.35)}
.fl.pop{animation:flIn .5s cubic-bezier(.3,1.5,.5,1) both}
.fl.slot{animation:none}
@keyframes flIn{from{opacity:0;transform:translateY(-34px) scale(.4) rotate(-16deg)}to{opacity:1;transform:none}}
@keyframes flOut{to{opacity:0;transform:scale(.4) translateY(10px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r0,-2deg))}50%{transform:translateY(-6px) rotate(var(--r1,2deg))}}
.fl-more{align-self:center;font-weight:700;font-size:.9rem;color:var(--sage);padding:0 6px}
@media(max-width:860px){.builder{padding:44px 16px;border-radius:26px}.bgrid{grid-template-columns:minmax(0,1fr)}.sum{padding:26px 16px}.it{flex-basis:150px}.it .step{justify-self:center}}

/* histoire + services */
.story{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:center}
.story .logo{--px:0;--py:0;background:var(--paper);border-radius:32px;padding:40px;box-shadow:var(--shadow)}

.story p{color:var(--ink-2);margin-top:16px;max-width:52ch}
@media(max-width:860px){.story{grid-template-columns:1fr;gap:34px}.story .logo{padding:26px}}
.map{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.map img{border-radius:26px;box-shadow:var(--shadow)}
.map ul{list-style:none;padding:0;margin:24px 0 28px}

@media(max-width:860px){.map{grid-template-columns:1fr;gap:30px}}

footer{background:var(--ink);color:#bfc0b6;padding:70px 0 34px;font-size:.93rem;margin-top:30px}
footer .wrap{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:34px}

.dlv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:center}

.dlv ul{list-style:none;padding:0;margin:22px 0 18px}

/* barre fixe */
.ov{position:fixed;inset:0;background:rgba(18,19,16,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:90}
.ov.on{opacity:1;pointer-events:auto}
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;gap:22px;width:min(620px,calc(100vw - 24px));padding:16px 16px 16px 24px;border-radius:24px;background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f6f3ea;box-shadow:0 24px 50px -16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08);opacity:0;visibility:hidden;transform:translate(-50%,24px);transition:opacity .45s var(--ease),transform .45s var(--ease),visibility 0s .45s}
.has-cart-items .dock{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .45s var(--ease),transform .45s var(--ease)}

.dock .m-dot{width:26px;height:26px;font-size:13px}

.dock-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border:0;border-radius:99px;cursor:pointer;background:var(--ivory);color:var(--ink);font:600 .88rem 'Open Sans';white-space:nowrap;transition:background .3s}

}

/* tiroir */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--paper);z-index:100;transform:translateX(104%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.25)}

.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}

.df{padding:20px 24px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}

.df .btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:13px 24px;border-radius:99px;z-index:120;transition:transform .5s var(--ease);font-weight:500;font-size:.92rem;max-width:calc(100vw - 32px)}

/* particules (explosion) */
.burst{position:fixed;pointer-events:none;z-index:200;border-radius:0 100% 0 100%;background:var(--c,#8DA25F);animation:burst .85s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) rotate(0) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(.3);opacity:0}}

/* carte agrandie */
.mmov{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:20px;background:rgba(20,16,10,.6);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s;overflow-y:auto}
.mmov.on{opacity:1;visibility:visible;transition:opacity .3s var(--ease)}
.mm{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;width:min(1080px,100%);margin:auto;background:var(--paper);border-radius:30px;padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);transform:translateY(20px) scale(.97);transition:transform .5s var(--ease)}
.mmov.on .mm{transform:none}
.mm-map{display:block;width:100%;height:100%;min-height:300px;border-radius:20px;background:#0f2a1c}
.mm-info{display:flex;flex-direction:column;gap:6px;padding:8px 4px 4px;min-width:0}
.mm-info h3{font-size:2rem;font-weight:700}
.mm-info p{color:var(--ink-2);margin-bottom:8px}
#mmList{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px;max-height:46vh;overflow-y:auto}
#mmList li{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--ivory)}
#mmList img{width:48px;height:58px;object-fit:cover;border-radius:8px}
#mmList b{display:block;font-size:.92rem;line-height:1.2}#mmList small{color:var(--ink-2)}
#mmList em{font-style:normal;font-weight:800}
.mm .nl-x{top:-12px;right:-12px}
.mm-info .btn{margin-top:auto}
@media(max-width:860px){.mm{grid-template-columns:minmax(0,1fr)}.mm-map{min-height:0;height:auto}#mmList li{grid-template-columns:40px minmax(0,1fr) auto}#mmList li .btn{grid-column:1/-1}}

.spot-card .btn:not(.ghost)+.btn{margin-top:8px;background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.spot-card .btn:not(.ghost)+.btn:hover{background:rgba(255,255,255,.14)}
.mm-mapw{position:relative;min-height:300px;border-radius:20px;overflow:hidden;background:#0f2a1c}
.mm-mapw .mm-map{position:absolute;inset:0;width:100%;height:100%;min-height:0;border-radius:0}
.mm-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:1.3rem;cursor:pointer;box-shadow:0 10px 22px -8px rgba(0,0,0,.6);transition:transform .3s var(--ease),background .25s}
.mm-nav.p{left:14px}.mm-nav.n{right:14px}
.mm-nav:hover{background:var(--sage);transform:translateY(-50%) scale(1.1)}
.mm-pos{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 14px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font:600 .8rem 'Open Sans',sans-serif}
@media(max-width:860px){.mm-mapw{min-height:240px}}
.card.flash{animation:cflash 2s var(--ease)}
@keyframes cflash{0%,60%{box-shadow:0 0 0 4px var(--green-d),0 30px 54px -22px rgba(34,34,34,.4)}100%{box-shadow:var(--shadow)}}

.dact{display:flex;align-items:center;gap:8px}
.cxl{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:600 .86rem 'Open Sans',sans-serif;cursor:pointer;transition:background .25s,border-color .25s}
.cxl:hover{border-color:var(--green-d);background:var(--green-l)}
.drawer{transition:transform .55s var(--ease),width .5s var(--ease),visibility 0s .55s}
.drawer.on{transition:transform .55s var(--ease),width .5s var(--ease)}
@media(min-width:900px){
  .drawer.xl{width:min(1080px,100%);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);grid-template-rows:auto auto auto 1fr;overflow:hidden}
  .drawer.xl .dh{grid-column:1/-1}
  .drawer.xl .lines{grid-column:1;grid-row:2/5;padding:10px 28px;min-height:0}
  .drawer.xl .prog{grid-column:2;grid-row:2}
  .drawer.xl #upsell{grid-column:2;grid-row:3}
  .drawer.xl .df{grid-column:2;grid-row:4;align-self:end;border-left:1px solid var(--line)}
  .drawer.xl .line{grid-template-columns:84px 1fr auto}
  .drawer.xl .line .th{width:84px;height:100px}
  .drawer.xl .line .nm{font-size:1.05rem}
}
@media(max-width:899px){.cxl{display:none}}
@media(max-width:560px){.cxl span{display:none}}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const eur=n=>n.toFixed(2).replace('.',',').replace(',00','')+' €';
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const S=SITE,T=S.t,G=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
/* ---------- contenu : tout vient de site.config.js ---------- */
function fill(){
  const B=S.brand,P=S.palette,css=document.documentElement.style;
  document.documentElement.lang=B.lang.slice(0,2);document.title=B.title;
  $('meta[name=description]').content=B.description;$('meta[name=theme-color]').content=P.ink;
  Object.entries({green:'green',greenD:'green-d',greenL:'green-l',sage:'sage',ink:'ink',ink2:'ink-2',ivory:'ivory',paper:'paper',line:'line'}).forEach(([k,v])=>P[k]&&css.setProperty('--'+v,P[k]));
  $$('[data-t]').forEach(e=>{e.textContent=G(T,e.dataset.t)});
  $$('[data-h]').forEach(e=>{e.innerHTML=G(T,e.dataset.h)});
  $$('img[data-logo]').forEach(i=>{i.src=B.logo;i.alt=B.name});
  const hb=$('.hero-bg');hb.style.backgroundImage=`url(${B.heroImg})`;hb.style.backgroundPosition=B.heroPos||'center';
  $('#storyImg').src=B.storyImg;$('#storyImg').alt=T.story.alt;
  const cn=f=>S.products.filter(f).length;
  $('#nav').innerHTML=S.cats.map(c=>`<li class="has-mega"><a href="#catalogue" data-go="${c.id}">${c.label}</a><div class="mega"><div class="mega-in wrap"><div class="mega-h"><b>${c.label}</b><p>${c.blurb}</p><a class="btn sm" href="#catalogue" data-go="${c.id}">Tout voir (${cn(p=>p.cat===c.id)})</a></div><div class="mega-l">${c.subs.map(([id,l])=>`<a href="#catalogue" data-go="${c.id}" data-sub="${id}">${l}<em>${cn(p=>p.sub===id)}</em></a>`).join('')}</div></div></div></li>`).join('')
    +[['box','Packs et box'],['origines','Origines'],['histoire','Histoire']].map(([id,l])=>`<li><a href="#${id}">${l}</a></li>`).join('');
  $('#mnav').innerHTML=S.cats.map(c=>`<details><summary>${c.label}</summary><a href="#catalogue" data-go="${c.id}"><b>Tout voir</b><em>${cn(p=>p.cat===c.id)}</em></a>${c.subs.map(([id,l])=>`<a href="#catalogue" data-go="${c.id}" data-sub="${id}">${l}<em>${cn(p=>p.sub===id)}</em></a>`).join('')}</details>`).join('')
    +[['box','Packs et box'],['origines','Origines'],['histoire','Histoire'],['boutique','Boutique']].map(([id,l])=>`<a href="#${id}">${l}</a>`).join('');
  $('#nlEmail').placeholder=T.nl.ph;
  const tel=$('#shopTel');if(tel){tel.textContent=B.phone;tel.href='tel:'+B.phoneHref}
  $('#heroH1').innerHTML=T.hero.lines.map(l=>`<span><i>${l}</i></span>`).join('');

  if(a){const x=PRE.find(q=>q.id===a.dataset.padd);
    Object.entries(x.fill).forEach(([k,v])=>add({key:'box-'+k,id:k,name:BY[k].name+' · '+x.short,unit:BY[k].price,qty:v,off:x.off}));
    burst(e.clientX,e.clientY,16);added('Ajouté : '+x.label)}
  if(s){setPre(s.dataset.pset);$('#builder').scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'})}
});
renderPacks();

/* ---------- bulletin mensuel (fenêtre contextuelle) ---------- */
(function(){
  const N=T.nl,ov=$('#nlov'),box=$('#nl'),inp=$('#nlEmail'),LS='brand-nl-off';
  let last=null;
  const stored=()=>{try{return localStorage.getItem(LS)}catch(e){return null}};
  function open(){if(ov.classList.contains('on'))return;last=document.activeElement;ov.classList.add('on');ov.setAttribute('aria-hidden','false');setTimeout(()=>inp.focus({preventScroll:true}),350)}
  function close(){ov.classList.remove('on');ov.setAttribute('aria-hidden','true');if($('#nlNever').checked){try{localStorage.setItem(LS,'1')}catch(e){}}try{sessionStorage.setItem('brand-nl-seen','1')}catch(e){}if(last&&last.focus)last.focus({preventScroll:true})}
  $('#nlX').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))close()});
  document.addEventListener('click',e=>{if(e.target.closest('[data-nl]')){e.preventDefault();box.classList.remove('done');open()}});
  $('#nlForm').addEventListener('submit',e=>{e.preventDefault();
    const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim());
    inp.classList.toggle('bad',!ok);$('#nlMsg').textContent=ok?'':N.err;
    if(!ok){inp.focus();return}
    box.classList.add('done');try{localStorage.setItem(LS,'1')}catch(_){}setTimeout(close,2600)});
  inp.addEventListener('input',()=>{inp.classList.remove('bad');$('#nlMsg').textContent=''});
  const skip=/[?&]nopopup/.test(location.search);
  let seen=null;try{seen=sessionStorage.getItem('brand-nl-seen')}catch(e){}
  if(!skip&&!stored()&&!seen)setTimeout(()=>{if(!document.body.classList.contains('cart-is-open'))open()},6000);
})();


/* panier : bouton agrandir */
(function(){
  const d=$('#drawer'),b=$('#xlCart');let LSK='cart-xl-'+S.brand.slug;
  function set(on){d.classList.toggle('xl',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Réduire le panier':'Agrandir le panier');b.title=b.getAttribute('aria-label');
    b.innerHTML=ic(on?'shrink':'expand')+'<span>'+(on?'Réduire':'Agrandir')+'</span>';try{localStorage.setItem(LSK,on?'1':'')}catch(e){}}
  b.addEventListener('click',()=>set(!d.classList.contains('xl')));
  let st='';try{st=localStorage.getItem(LSK)}catch(e){}if(st)set(true);
})();
[renderTiers,renderBox,renderCart].forEach(f=>{try{f()}catch(err){console.error(f.name,err)}});
</script>
